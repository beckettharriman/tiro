<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiro</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <!-- The .panel fills the frameless, transparent OS window. Both the panel
       page and the slide-over Settings page live inside .slidebox. app.js
       builds their inner DOM. -->
  <div class="panel" id="panel" role="dialog" aria-label="Tiro">
    <div class="slidebox" id="slidebox">
      <div class="page panel-page" id="panelPage" aria-hidden="false" style="left:0"></div>
      <div class="page settings-page" id="settingsPage" aria-hidden="true" style="left:100%"></div>
    </div>
  </div>

  <script src="bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
