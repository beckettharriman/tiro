# Tiro configuration (reference).
#
# Tiro creates its own config.ini from built-in defaults on first run and
# rewrites it whenever you change a setting in the panel (Ctrl+Alt+V), so you
# normally never edit this by hand. Copy this file to config.ini only if you
# want to pre-seed your settings.
#
# Two things to know:
#   * Tiro strips comments the next time it saves the file.
#   * Do NOT put trailing/inline comments on a value line — everything after
#     "key =" is taken literally as the value. Use full-line comments only.

[general]

# Hotkeys (modifiers + key joined with "+", e.g. ctrl+alt+space).
# Registered as system-wide global shortcuts; if a combo is already in use
# by another app it can't be claimed (rebind it in Settings -> Shortcuts).
dictation_hotkey = ctrl+alt+space
panel_hotkey = ctrl+alt+v
cancel_hotkey = ctrl+alt+x

# Transcription engine.
# device: auto = GPU when plugged in, CPU on battery; or force cpu | gpu
# (the legacy value "cuda" is accepted and treated as gpu).
device = auto
# CPU model quantization (the GPU path always runs full precision).
compute_type = int8
# Lighter / faster model used on CPU / on battery.
model_battery = base.en
# More accurate model used on GPU / when plugged in.
model_ac = small.en
# Legacy fallback if the two models above are missing.
model = base.en

# Microphone: matched as a case-insensitive substring of the device name.
# Leave blank to use the first available microphone.
mic_name =

# Clipboard cleanup applied to the copied text: none | light | fillers.
clipboard_cleanup = light
# Prime Whisper with vocab.txt so it spells your names / jargon correctly.
use_vocab_bias = true
# Show the floating "Recording" pill while dictating.
pill = true
# Soft sound cues, and their loudness (0.0 - 1.5).
beeps = true
sound_volume = 1.0

# Appearance: theme is system | light | dark; transparency is 0 (solid) - 100.
theme = system
panel_transparency = 45

# Where verbatim transcripts are written (JSONL + Markdown, one file per day).
# Defaults to Documents/Tiro in your home folder; change it in
# Settings -> Storage. If this path is unwritable, Tiro falls back to the
# "logs" folder next to the app.
vault_dir = /home/yourname/Documents/Tiro
fallback_dir = logs
