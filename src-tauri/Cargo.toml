[package]
name = "tiro"
version = "0.1.0"
description = "Always-on, fully-offline dictation to clipboard"
authors = ["beckettharriman"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tiro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-ini = "0.21.3"
chrono = "0.4.45"
cpal = "0.18.1"
rodio = "0.22.2"
arboard = "3.6.1"
regex = "1.13.1"
# raw-api exposes the ggml backend-device enumeration used by the
# `--gpu-enum` child (hw.rs); it changes no resolved dependencies.
whisper-rs = { version = "0.16.0", features = ["raw-api"] }
ureq = "3.3.0"
hound = "3.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-autostart = "2.5.1"
auto-launch = "0.5"

[features]
# GPU inference (Vulkan) for the `--gpu-worker` child process. Plain
# `cargo build` stays CPU-only and needs no Vulkan SDK; the worker
# subcommand then reports itself unavailable and the app serves on CPU.
gpu = ["whisper-rs/vulkan"]
# Native Apple GPU backend; no Vulkan SDK is needed on macOS.
metal = ["whisper-rs/metal"]

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
core-foundation = "0.10"
core-graphics = "0.25"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = [
    "tokio",
    "remote_desktop",
    # remote_desktop's response types borrow screencast's Stream, so the
    # module does not compile without this feature too.
    "screencast",
    # Wayland global hotkeys (hotkeys_portal.rs).
    "global_shortcuts",
] }
gtk = "0.18"
x11rb = { version = "0.14", features = ["xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Power", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
