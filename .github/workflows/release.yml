# Builds the installers and attaches them to a GitHub Release.
#
# Runs on a version tag (v0.2.0) or by hand from the Actions tab; a manual
# run only builds and leaves the installers on the run as artifacts. The
# version lives in src-tauri/Cargo.toml alone (tauri.conf.json inherits it),
# so a tag that disagrees with it fails fast instead of shipping a release
# labelled one thing and reporting another.
#
# Every installer ships GPU support. The app is two executables: `tiro`,
# built without any GPU backend so it loads on every machine, and
# `tiro-gpu-worker`, rebuilt with `--features gpu` (whisper.cpp's Vulkan
# backend) in its own cargo invocation so the Vulkan link never reaches
# `tiro` (see src-tauri/Cargo.toml; `tauri build` runs that invocation as
# its beforeBundleCommand). The bundler ships the worker next to the app;
# the app spawns it for GPU inference and device enumeration and serves on
# CPU when it cannot run — no Vulkan runtime, no usable device. That is
# why both runners install the Vulkan SDK (headers + glslc) below, pinned
# so the build does not drift on its own, and why the verify steps refuse
# an installer whose `tiro` links Vulkan or whose worker is missing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "Cargo.toml version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$VERSION" ]; then
            echo "::error::tag v$tag does not match src-tauri/Cargo.toml version $VERSION"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # The .deb, .rpm and AppImage inherit this image's glibc and
          # WebKitGTK as their floor; an older LTS label would run on more
          # distros, at the price of the label disappearing sooner.
          - os: ubuntu-24.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same package line as SETUP.md, plus patchelf for the AppImage and
      # the Vulkan headers + glslc the worker's whisper.cpp build needs.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxdo-dev patchelf \
            libvulkan-dev glslc

      # Windows runners ship VS 2022, a Windows CMake and LLVM; bindgen only
      # needs pointing at libclang. NSIS and WiX are fetched by the bundler.
      - name: Windows build environment
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # The LunarG SDK, pinned by version and checksum (both from
      # https://vulkan.lunarg.com/sdk/home). whisper-rs-sys reads VULKAN_SDK
      # for vulkan-1.lib; whisper.cpp's CMake finds glslc through it too.
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.357.0
          VULKAN_SHA256: 81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d
        run: |
          $exe = "$env:RUNNER_TEMP\vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:VULKAN_SHA256) { throw "Vulkan SDK checksum mismatch: $hash" }
          $p = Start-Process -FilePath $exe -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$env:VULKAN_VERSION\Bin" >> $env:GITHUB_PATH

      - run: npm ci
      # The plain `cargo build --release`, then the worker-only Vulkan build
      # (`beforeBundleCommand` in src-tauri/tauri.{linux,windows}.conf.json),
      # then the bundles. NO_STRIP: linuxdeploy ships a binutils too old for
      # the .relr.dyn sections in current distro libraries and aborts the
      # AppImage when its strip fails. Skipping the strip costs a few MB,
      # nothing else.
      - run: npx tauri build
        env:
          NO_STRIP: true

      # The split is the whole point: fail the run rather than ship a
      # `tiro` that needs Vulkan to load, or an installer without the worker.
      - name: Verify the installers (Linux)
        if: runner.os == 'Linux'
        working-directory: src-tauri/target/release
        run: |
          if ldd tiro | grep -i vulkan; then
            echo "::error::tiro links Vulkan"; exit 1
          fi
          ldd tiro-gpu-worker | grep -i vulkan || { echo "::error::tiro-gpu-worker does not link Vulkan"; exit 1; }
          ./tiro-gpu-worker --gpu-enum
          # The listings double as the run's record of what shipped.
          dpkg -c bundle/deb/*.deb | grep -E 'usr/bin/'
          dpkg -c bundle/deb/*.deb | grep -qE 'usr/bin/tiro-gpu-worker$' || { echo "::error::deb lacks the worker"; exit 1; }
          rpm -qlp bundle/rpm/*.rpm | grep -E '/usr/bin/'
          rpm -qlp bundle/rpm/*.rpm | grep -qE '^/usr/bin/tiro-gpu-worker$' || { echo "::error::rpm lacks the worker"; exit 1; }
          dpkg -I bundle/deb/*.deb | grep -E '^ Depends:.*libvulkan1' || { echo "::error::deb does not depend on libvulkan1"; exit 1; }
          rpm -qpR bundle/rpm/*.rpm | grep -E '^vulkan-loader' || { echo "::error::rpm does not depend on vulkan-loader"; exit 1; }
          appimage=$(ls bundle/appimage/*.AppImage)
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/src-tauri/target/release/$appimage" --appimage-extract > /dev/null)
          ls -l "$RUNNER_TEMP/squashfs-root/usr/bin/"
          test -x "$RUNNER_TEMP/squashfs-root/usr/bin/tiro-gpu-worker" || { echo "::error::AppImage lacks the worker"; exit 1; }

      - name: Verify the installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src-tauri/target/release
        run: |
          $readobj = 'C:\Program Files\LLVM\bin\llvm-readobj.exe'
          if (& $readobj --coff-imports tiro.exe | Select-String -Quiet -Pattern 'vulkan-1.dll') {
            throw 'tiro.exe imports vulkan-1.dll'
          }
          if (-not (& $readobj --coff-imports tiro-gpu-worker.exe | Select-String -Quiet -Pattern 'vulkan-1.dll')) {
            throw 'tiro-gpu-worker.exe does not import vulkan-1.dll'
          }
          $nsis = Get-ChildItem bundle\nsis\*.exe | Select-Object -First 1
          $nsisFiles = & 7z l $nsis.FullName | Select-String -Pattern '\.exe$'
          $nsisFiles
          if (-not ($nsisFiles | Select-String -Quiet -Pattern 'tiro-gpu-worker.exe')) {
            throw "$($nsis.Name) lacks the worker"
          }
          $msi = Get-ChildItem bundle\msi\*.msi | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP 'msi'
          $p = Start-Process msiexec -ArgumentList '/a', $msi.FullName, '/qn', "TARGETDIR=$extract" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a exited with $($p.ExitCode)" }
          Get-ChildItem -Recurse $extract -Filter *.exe | Select-Object -ExpandProperty FullName
          if (-not (Get-ChildItem -Recurse $extract -Filter tiro-gpu-worker.exe)) {
            throw "$($msi.Name) lacks the worker"
          }

      # Globbed by extension, never by name: a renamed bundle or a target
      # added in tauri.conf.json still lands here, and an empty set fails.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -l installers
      # A draft, so the notes can be read over before anyone sees the
      # release; publishing it is one click on the Releases page.
      - uses: softprops/action-gh-release@v2
        with:
          name: Tiro ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: installers/*
